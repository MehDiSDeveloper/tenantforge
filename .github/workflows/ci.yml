name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ENVIRONMENT: test
  LOG_LEVEL: WARNING
  LOG_FORMAT: console
  APP_DB_ROLE: tenantforge_app
  APP_DB_PASSWORD: app-test-password
  DATABASE_ADMIN_URL: postgresql+asyncpg://tenantforge:tenantforge@localhost:5432/tenantforge_test
  DATABASE_URL: postgresql+asyncpg://tenantforge_app:app-test-password@localhost:5432/tenantforge_test
  SECRET_KEY: ci-secret-key-not-used-anywhere-else-0123456789
  RATE_LIMIT_ENABLED: "false"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: mypy (strict)
        run: mypy app scripts

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tenantforge
          POSTGRES_PASSWORD: tenantforge
          POSTGRES_DB: tenantforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tenantforge -d tenantforge_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: pytest
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: one-command startup still works
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 3
          done
          docker compose logs
          exit 1
